<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">Wearable basketball shot sensing system architecture</title>
<desc id="d">Two MPU6050 sensors on the arm connect to an Arduino Nano and nRF24L01 transmitter, data is received by an Arduino Uno base station and processed by a Python FastAPI backend for live dashboard, segmentation and analysis.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607b8e"/></marker></defs>
<rect width="900" height="500" rx="26" fill="#f8fbfd"/>
<text x="42" y="52" font-family="Arial" font-size="26" font-weight="700" fill="#17384f">Wearable basketball shot sensing</text>
<text x="42" y="82" font-family="Arial" font-size="16" fill="#657887">100 Hz dual-IMU wireless sensing → processing → analysis</text>
<g font-family="Arial">
 <g transform="translate(40 160)"><rect width="160" height="178" rx="20" fill="#edf3f7" stroke="#91adbe" stroke-width="2"/><circle cx="48" cy="67" r="24" fill="#7aa7bf"/><circle cx="112" cy="67" r="24" fill="#7aa7bf"/><text x="34" y="73" font-size="14" font-weight="700" fill="#fff">IMU</text><text x="98" y="73" font-size="14" font-weight="700" fill="#fff">IMU</text><text x="26" y="120" font-size="18" font-weight="700" fill="#2a5169">Arm sensors</text><text x="26" y="146" font-size="15" fill="#667988">2× MPU6050</text></g>
 <path d="M200 249H248" stroke="#607b8e" stroke-width="3" marker-end="url(#arrow)"/>
 <g transform="translate(264 142)"><rect width="166" height="214" rx="20" fill="#f4f0e9" stroke="#c5aa84" stroke-width="2"/><text x="24" y="43" font-size="19" font-weight="700" fill="#715837">Wearable node</text><rect x="24" y="66" width="118" height="44" rx="9" fill="#fff" stroke="#d5c4aa"/><text x="42" y="94" font-size="16" fill="#715837">Arduino Nano</text><path d="M83 110V132" stroke="#9a8060" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="141" width="118" height="44" rx="9" fill="#fff" stroke="#d5c4aa"/><text x="40" y="169" font-size="16" fill="#715837">nRF24L01+</text></g>
 <path d="M430 249H478" stroke="#607b8e" stroke-width="3" marker-end="url(#arrow)"/>
 <g transform="translate(494 168)"><rect width="150" height="162" rx="20" fill="#edf5f8" stroke="#8cadc0" stroke-width="2"/><text x="25" y="43" font-size="19" font-weight="700" fill="#2c5269">Base station</text><text x="25" y="80" font-size="16" fill="#647988">nRF24L01+</text><text x="25" y="107" font-size="16" fill="#647988">Arduino Uno</text><text x="25" y="134" font-size="16" fill="#647988">USB serial</text></g>
 <path d="M644 249H692" stroke="#607b8e" stroke-width="3" marker-end="url(#arrow)"/>
 <g transform="translate(708 126)"><rect width="154" height="246" rx="20" fill="#eef3f8" stroke="#90a8bc" stroke-width="2"/><text x="22" y="41" font-size="19" font-weight="700" fill="#2a5068">Python system</text><text x="22" y="78" font-size="16" fill="#657989">preprocessing</text><text x="22" y="105" font-size="16" fill="#657989">shot segmentation</text><text x="22" y="132" font-size="16" fill="#657989">feature extraction</text><rect x="22" y="157" width="110" height="52" rx="10" fill="#fff" stroke="#c7d6e0"/><polyline points="32,190 48,178 62,184 78,169 94,187 116,174" fill="none" stroke="#3c82a7" stroke-width="3"/><text x="22" y="231" font-size="15" font-weight="700" fill="#2a5068">FastAPI dashboard</text></g>
