<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">Dynamic manipulator motion planning observation pipeline</title>
<desc id="d">Robot links and a moving obstacle are encoded into a link-centric surface-distance grid, forming a policy observation for dynamic obstacle avoidance.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55758d"/></marker>
  <linearGradient id="grid" x1="0" x2="1"><stop offset="0" stop-color="#e8f3f8"/><stop offset="1" stop-color="#d9eaf3"/></linearGradient>
</defs>
<rect width="900" height="500" rx="26" fill="#f8fbfd"/>
<text x="42" y="52" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#17384f">Dynamic manipulator motion planning</text>
<text x="42" y="82" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#657887">Link-centric obstacle representation for policy observation</text>
<g transform="translate(42 122)">
  <rect width="285" height="290" rx="22" fill="#fff" stroke="#d8e5ed" stroke-width="2"/>
  <text x="22" y="34" font-family="Arial" font-size="18" font-weight="700" fill="#31556d">Dynamic scene</text>
  <rect x="25" y="236" width="74" height="22" rx="5" fill="#315f7c"/>
  <circle cx="95" cy="236" r="10" fill="#173d56"/>
  <path d="M95 236L142 178" stroke="#2d6e97" stroke-width="18" stroke-linecap="round"/>
  <circle cx="142" cy="178" r="11" fill="#173d56"/>
  <path d="M142 178L205 136" stroke="#4a8fb4" stroke-width="18" stroke-linecap="round"/>
  <circle cx="205" cy="136" r="11" fill="#173d56"/>
  <path d="M205 136L242 174" stroke="#68a9c6" stroke-width="16" stroke-linecap="round"/>
  <circle cx="242" cy="174" r="10" fill="#173d56"/>
  <rect x="176" y="66" width="60" height="52" rx="10" fill="#f3d9c9" stroke="#c56c36" stroke-width="2"/>
  <path d="M244 92H271" stroke="#c56c36" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="169" y="54" font-family="Arial" font-size="15" font-weight="700" fill="#8b4b26">moving obstacle</text>
  <path d="M112 216A34 34 0 0 1 135 190M157 171A35 35 0 0 1 187 150M218 144A34 34 0 0 1 241 165" fill="none" stroke="#2d84b3" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="24" y="278" font-family="Arial" font-size="14" fill="#667988">Per-link geometry + obstacle motion</text>
</g>
<path d="M347 268H405" stroke="#55758d" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(418 145)">
  <rect width="205" height="244" rx="22" fill="url(#grid)" stroke="#8fb4c8" stroke-width="2"/>
  <text x="22" y="35" font-family="Arial" font-size="19" font-weight="700" fill="#244e68">Link-centric grid</text>
  <g transform="translate(25 62)">
    <rect width="155" height="118" rx="12" fill="#fff" stroke="#c8d9e4"/>
    <g stroke="#b8d0df" stroke-width="1.5"><path d="M31 0V118M62 0V118M93 0V118M124 0V118"/><path d="M0 29H155M0 58H155M0 87H155"/></g>
    <rect x="62" y="29" width="31" height="29" fill="#84b8d2"/><rect x="93" y="58" width="31" height="29" fill="#c6dfea"/><rect x="31" y="87" width="31" height="29" fill="#a4c9dc"/>
  </g>
  <text x="22" y="207" font-family="Arial" font-size="15" fill="#526f81">surface distance</text>
  <text x="22" y="229" font-family="Arial" font-size="15" fill="#526f81">+ approach direction</text>
</g>
<path d="M642 268H694" stroke="#55758d" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(708 176)">
  <rect width="150" height="184" rx="22" fill="#e9f2f7" stroke="#82a9bf" stroke-width="2"/>
  <text x="23" y="40" font-family="Arial" font-size="20" font-weight="700" fill="#244e68">Policy</text>
  <circle cx="75" cy="92" r="31" fill="#d2e5ef" stroke="#6f9eb8" stroke-width="2"/>
  <path d="M58 93L70 105L94 78" fill="none" stroke="#2d789e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="22" y="145" font-family="Arial" font-size="15" fill="#526f81">collision-aware</text>
  <text x="22" y="166" font-family="Arial" font-size="15" fill="#526f81">motion action</text>
</g>
</svg>