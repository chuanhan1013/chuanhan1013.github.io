name: Preview DynUR TikZ

on:
  push:
    branches: [redraw-dynur-tikz]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and converters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-pictures poppler-utils
      - name: Compile TikZ figure
        working-directory: assets/diagrams/src
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error dynur.tex
          pdftocairo -svg dynur.pdf ../dynur.generated.svg
          pdftoppm -png -r 180 -singlefile dynur.pdf /tmp/dynur-preview
      - name: Validate output
        run: |
          test -s assets/diagrams/dynur.generated.svg
          test -s /tmp/dynur-preview.png
          grep -q '<svg' assets/diagrams/dynur.generated.svg
      - uses: actions/upload-artifact@v4
        with:
          name: dynur-tikz-preview
          path: |
            assets/diagrams/src/dynur.pdf
            assets/diagrams/dynur.generated.svg
            /tmp/dynur-preview.png
          if-no-files-found: error
