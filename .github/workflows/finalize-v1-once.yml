name: Finalize portfolio v1 once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'finalize-portfolio-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install diagram toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-pictures texlive-fonts-recommended dvisvgm

      - name: Compile basketball TikZ to SVG
        run: |
          mkdir -p /tmp/basketball-build
          latex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/basketball-build assets/diagrams/src/imu-basketball.tex
          dvisvgm --no-fonts --bbox=min --output=assets/diagrams/imu-basketball.svg /tmp/basketball-build/imu-basketball.dvi
          test -s assets/diagrams/imu-basketball.svg
          grep -q '<svg' assets/diagrams/imu-basketball.svg

      - name: Cache official identity and project media
        run: |
          mkdir -p assets/icons assets/media
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://static.wixstatic.com/media/0752bb_6ccf3f2f6ef441c5b080e94573e6eebf~mv2.png' \
            -o assets/icons/mlmv-lab.png
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://nus.edu.sg/images/default-source/identity-images/fullcolorlogo.jpg' \
            -o assets/icons/nus-fullcolor.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://www.ntu.edu.tw/about/doc/Emblem72.jpg' \
            -o assets/icons/ntu-emblem.jpg
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/chuanhan1013/isaaclab-torque-locomotion/main/results/gym_reference/ev_stairs.gif' \
            -o assets/media/sata-stairs.gif
          test -s assets/icons/mlmv-lab.png
          test -s assets/icons/nus-fullcolor.jpg
          test -s assets/icons/ntu-emblem.jpg
          test -s assets/media/sata-stairs.gif

      - name: Replace hotlinks and retire obsolete egg diagram
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          mlmv = 'https://static.wixstatic.com/media/0752bb_6ccf3f2f6ef441c5b080e94573e6eebf~mv2.png/v1/crop/x_4%2Cy_0%2Cw_180%2Ch_210/fill/w_38%2Ch_44%2Cal_c%2Cq_95%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/logo.png'
          s = s.replace(mlmv, 'assets/icons/mlmv-lab.png')
          s = s.replace('https://nus.edu.sg/images/default-source/identity-images/fullcolorlogo.jpg', 'assets/icons/nus-fullcolor.jpg')
          s = s.replace('https://www.ntu.edu.tw/about/doc/Emblem72.jpg', 'assets/icons/ntu-emblem.jpg')
          s = s.replace('https://unavatar.io/linkedin/user:chuanhan-li', 'assets/media/profile-chuanhan.jpg')
          s = s.replace(
              'src="assets/diagrams/egg-multimodal.svg" alt="Visible and thermal multimodal fertility-detection pipeline"',
              'src="assets/media/egg-setup.webp" alt="Controlled visible and thermal duck-egg imaging setup"'
          )
          index.write_text(s)

          media = Path('media-patch.js')
          s = media.read_text()
          s = s.replace(
              'https://raw.githubusercontent.com/chuanhan1013/isaaclab-torque-locomotion/main/results/gym_reference/ev_stairs.gif',
              'assets/media/sata-stairs.gif'
          )
          media.write_text(s)
          PY
          git rm -f assets/diagrams/egg-multimodal.svg

      - name: Refresh asset wishlist
        run: |
          cat > ASSET_WISHLIST.md <<'EOF'
          # Portfolio asset wishlist

          The v1 portfolio now contains original media for the egg-fertility study, basketball sensing system, cleaning robot, triathlon robot, and SATA locomotion project. Core organisation and school marks used by the page are cached locally.

          ## Optional future upgrades

          1. **NUS dynamic manipulator research**
             - publication-safe FR3 / UR manipulator demo in a dynamic-obstacle scene
             - public visualization or result figure once the work is ready to disclose

          2. **Autonomous cleaning robot**
             - competition-run video/GIF
             - representative perception / red-zone detection output

          3. **HAN-Agents**
             - safe trace, evaluation, or orchestration screenshot
             - exclude proprietary code, client data, internal URLs, credentials, and secrets

          These are enhancement opportunities, not blockers for v1.
          EOF

      - name: QA references and JavaScript
        run: |
          node --check script.js
          node --check script-core.js
          node --check media-patch.js
          python - <<'PY'
          from pathlib import Path
          import re, sys

          forbidden = {
              'wixstatic.com': 'MLMV logo hotlink',
              'nus.edu.sg/images/default-source/identity-images/fullcolorlogo.jpg': 'NUS logo hotlink',
              'ntu.edu.tw/about/doc/Emblem72.jpg': 'NTU logo hotlink',
              'raw.githubusercontent.com/chuanhan1013/isaaclab-torque-locomotion': 'SATA media hotlink',
              'unavatar.io/linkedin/user:chuanhan-li': 'profile hotlink',
              'egg-multimodal.svg': 'retired egg diagram reference',
          }
          checked = ['index.html', 'script.js', 'script-core.js', 'media-patch.js', 'styles.css']
          text = '\n'.join(Path(p).read_text(errors='ignore') for p in checked if Path(p).exists())
          bad = [f'{label}: {needle}' for needle, label in forbidden.items() if needle in text]
          if bad:
              print('\n'.join(bad), file=sys.stderr)
              raise SystemExit(1)

          refs = set()
          for p in checked:
              if not Path(p).exists():
                  continue
              t = Path(p).read_text(errors='ignore')
              refs.update(re.findall(r"assets/[A-Za-z0-9_./+\-]+\.(?:png|jpe?g|webp|gif|svg)", t, flags=re.I))
          missing = sorted(r for r in refs if not Path(r).exists())
          if missing:
              print('Missing local assets:', *missing, sep='\n  ', file=sys.stderr)
              raise SystemExit(1)
          print(f'Validated {len(refs)} local media/icon/diagram references.')
          PY

      - name: Commit finalized v1 and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-v1-once.yml
          git add index.html media-patch.js ASSET_WISHLIST.md assets/diagrams/imu-basketball.svg assets/diagrams/src/imu-basketball.tex assets/icons assets/media/sata-stairs.gif
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize portfolio v1 media and diagrams'
          git push origin HEAD:${{ github.head_ref }}
