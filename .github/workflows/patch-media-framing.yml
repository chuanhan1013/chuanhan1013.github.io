name: Patch media framing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix-media-framing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-media-framing
          fetch-depth: 0
      - name: Patch requested media details
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('script.js')
          js = p.read_text()

          # Basketball: remove duplicate side photo and move GIF focal crop downward.
          duplicate = '    <figure class="carousel-slide is-contained"><img data-src="assets/media/basketball-side.webp" alt="Side view of the dual-IMU wearable sensing prototype" decoding="async"><figcaption class="carousel-caption">Dual-IMU placement</figcaption></figure>\n'
          js = js.replace(duplicate, '', 1)
          gif_old = '    <figure class="carousel-slide is-contained"><img data-src="assets/media/basketball-sensing-demo.gif" alt="Wearable dual-IMU basketball sensing demo with live motion traces" decoding="async"><figcaption class="carousel-caption">Live sensing demo</figcaption></figure>'
          gif_new = '    <figure class="carousel-slide basketball-demo"><img data-src="assets/media/basketball-sensing-demo.gif" alt="Wearable dual-IMU basketball sensing demo with live motion traces" decoding="async"><figcaption class="carousel-caption">Live sensing demo</figcaption></figure>'
          if gif_old in js:
              js = js.replace(gif_old, gif_new, 1)

          # Triathlon: previous slide 2 becomes slide 1; report Fig. 2-11 becomes slide 2; beam moves to slide 3.
          tri_old = '''    <figure class="carousel-slide is-active is-contained"><img src="assets/media/triathlon-beam.webp" alt="Terrain-adaptive tracked robot configured for narrow-beam traversal" loading="lazy" decoding="async"><figcaption class="carousel-caption">Beam-stage configuration</figcaption></figure>
    <figure class="carousel-slide is-contained"><img data-src="assets/media/triathlon-amphibious.webp" alt="Final amphibious configuration of the terrain-adaptive triathlon robot" decoding="async"><figcaption class="carousel-caption">Final amphibious configuration</figcaption></figure>'''
          tri_new = '''    <figure class="carousel-slide is-active triathlon-hero"><img src="assets/media/triathlon-amphibious.webp" alt="Final amphibious configuration of the terrain-adaptive triathlon robot" loading="lazy" decoding="async"><figcaption class="carousel-caption">Final amphibious configuration</figcaption></figure>
    <figure class="carousel-slide is-contained"><img data-src="assets/media/triathlon-water-config.webp" alt="Water-channel configuration of the transformed triathlon robot" decoding="async"><figcaption class="carousel-caption">Water-channel transformed configuration · report Fig. 2-11</figcaption></figure>
    <figure class="carousel-slide is-contained"><img data-src="assets/media/triathlon-beam.webp" alt="Terrain-adaptive tracked robot configured for narrow-beam traversal" decoding="async"><figcaption class="carousel-caption">Beam-stage configuration</figcaption></figure>'''
          if tri_old in js:
              js = js.replace(tri_old, tri_new, 1)
          elif 'assets/media/triathlon-water-config.webp' not in js:
              raise SystemExit('Triathlon gallery pattern not found')

          # SATA: replace duplicate third still with the existing stair-traversal GIF from the user's SATA repo.
          sata_marker = '/* SATA gallery: replace duplicated final still with stair traversal reference */'
          if sata_marker not in js:
              anchor = "if (projectGrid && !projectGrid.querySelector('.mini-card')) projectGrid.remove();\n"
              if anchor not in js:
                  raise SystemExit('SATA insertion anchor not found')
              sata = '''\n/* SATA gallery: replace duplicated final still with stair traversal reference */
const sataCard = [...document.querySelectorAll('#projects .feature-card')].find(card => card.querySelector('h3')?.textContent.includes('Bio-Inspired'));
const sataThirdSlide = sataCard?.querySelectorAll('.carousel-slide')?.[2];
if (sataThirdSlide) {
  const img = sataThirdSlide.querySelector('img');
  if (img) {
    img.removeAttribute('src');
    img.dataset.src = 'https://raw.githubusercontent.com/chuanhan1013/isaaclab-torque-locomotion/main/results/gym_reference/ev_stairs.gif';
    img.alt = 'Isaac Gym reference policy traversing stairs';
    img.referrerPolicy = 'no-referrer';
  }
  const cap = sataThirdSlide.querySelector('figcaption');
  if (cap) cap.textContent = 'Isaac Gym reference · stair traversal';
}
'''
              js = js.replace(anchor, anchor + sata, 1)

          # Focal framing rules.
          if '.basketball-demo{padding:0!important' not in js:
              css_anchor = '.feature-media img{cursor:zoom-in}'
              if css_anchor not in js:
                  raise SystemExit('CSS insertion anchor not found')
              css = '.basketball-demo{padding:0!important;background:#0d1720!important}.basketball-demo img{object-fit:cover!important;object-position:50% 68%!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important}.triathlon-hero{padding:0!important}.triathlon-hero img{object-fit:cover!important;object-position:50% 62%!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important}'
              js = js.replace(css_anchor, css_anchor + css, 1)

          p.write_text(js)
          PY
          node --check script.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .media-patch-trigger .github/workflows/fix-media-framing-once.yml || true
          git add script.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix SATA, basketball and triathlon media framing'
            git push origin HEAD:fix-media-framing
          fi
