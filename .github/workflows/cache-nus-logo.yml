name: Cache NUS vertical logo

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cache-logo:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Download official NUS vertical logo
        run: |
          mkdir -p assets/icons
          curl -fL --retry 3 --retry-delay 2 \
            'https://www.nus.edu.sg/images/default-source/identity-images/fullcolorlogo_v.jpg' \
            -o assets/icons/nus-vertical.jpg
          file assets/icons/nus-vertical.jpg
          test -s assets/icons/nus-vertical.jpg
      - name: Commit cached asset and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons/nus-vertical.jpg
          git rm .github/workflows/cache-nus-logo.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Cache official NUS vertical logo'
          git push origin HEAD:${{ github.head_ref }}
