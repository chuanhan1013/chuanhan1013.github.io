name: Finalize cleaning and basketball media

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Rebuild basketball animation and verify media
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-basket/basketball-demo.part* > /tmp/basketball-demo.b64
          base64 --decode /tmp/basketball-demo.b64 > assets/media/basketball-demo-landscape.webp
          echo "83bc5c7fdf91bde267f940eab93ca50f03e838474b8ee79d6f15cbafa5eeebb9  assets/media/basketball-demo-landscape.webp" | sha256sum --check
          test -s assets/media/cleaning-final.webp
          test -s assets/media/cleaning-cad.webp
          test -s assets/media/cleaning-cfd.webp
          node --check media-hotfix.js
          node --check script.js

      - name: Remove temporary builder inputs
        shell: bash
        run: |
          rm -rf .tmp-basket
          rm -f .github/workflows/finalize-cleaning-basketball.yml

      - name: Commit finalized media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize cleaning and basketball media"
          git push origin HEAD:${{ github.head_ref }}
