name: Fix Isaac icons once

on:
  push:
    branches: [fix-isaac-icons]
    paths: [.github/workflows/fix-isaac-icons-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-isaac-icons
          fetch-depth: 0
      - name: Patch Isaac skill/platform marks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()
          s = s.replace("  ['Arduino', devicon('arduino')], ['Raspberry Pi', devicon('raspberrypi')], ['FastAPI', devicon('fastapi')],\n  ['Isaac Gym', devicon('nvidia')], ['Isaac Lab', devicon('nvidia')]\n", "  ['Arduino', devicon('arduino')], ['Raspberry Pi', devicon('raspberrypi')], ['FastAPI', devicon('fastapi')]\n")
          s = s.replace("const iconMap = new Map([", "const iconMap = new Map([")
          s = s.replace("function iconImg(src, alt = '') {", "const skillGlyphMap = new Map([['Isaac Gym', 'IG'], ['Isaac Lab', 'IL']]);\nfunction iconImg(src, alt = '') {")
          old = "    if (src) item.append(iconImg(src)); else { const dot = document.createElement('span'); dot.className = 'skill-dot'; item.append(dot); }"
          new = "    if (src) item.append(iconImg(src)); else if (skillGlyphMap.has(label)) { const glyph = document.createElement('span'); glyph.className = 'platform-glyph skill-platform-glyph'; glyph.textContent = skillGlyphMap.get(label); item.append(glyph); } else { const dot = document.createElement('span'); dot.className = 'skill-dot'; item.append(dot); }"
          if old not in s:
              raise SystemExit('skill item pattern not found')
          s = s.replace(old, new)
          old2 = "  else if (title.includes('Bio-Inspired')) addPlatformStrip(card, [{label:'NVIDIA / Isaac',icon:devicon('nvidia')},{label:'Python',icon:devicon('python')},{label:'PyTorch',icon:devicon('pytorch')}]);"
          new2 = "  else if (title.includes('Bio-Inspired')) addPlatformStrip(card, [{label:'Isaac Lab',glyph:'IL'},{label:'Isaac Gym',glyph:'IG'},{label:'Python',icon:devicon('python')},{label:'PyTorch',icon:devicon('pytorch')}]);"
          if old2 not in s:
              raise SystemExit('SATA platform pattern not found')
          s = s.replace(old2, new2)
          s = s.replace(".skill-dot{width:6px;height:6px;border-radius:50%;background:#9ab3c5}", ".skill-dot{width:6px;height:6px;border-radius:50%;background:#9ab3c5}.skill-platform-glyph{min-width:18px;height:18px;padding:0 3px;font-size:6px}")
          p.write_text(s)
          PY
          node --check script.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git rm .github/workflows/fix-isaac-icons-once.yml
          git commit -m 'fix Isaac Lab and Isaac Gym marks'
          git push origin HEAD:fix-isaac-icons
