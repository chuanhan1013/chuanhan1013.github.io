version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      lint-and-test:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript*',
            'prettier*',
            'html-validate',
            '@types/*',
            '@playwright/*',
            '@axe-core/*',
            'globals',
          ]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
