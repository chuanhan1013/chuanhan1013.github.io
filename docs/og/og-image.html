<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
  Social preview card (1200×630), tuned for LinkedIn's Featured section: a light card that
  stands out in the dark UI, the face, four pieces of work, and few words. LinkedIn prints the
  page title and URL under the image and trims about 5% off each side, so the card repeats
  neither and keeps a 100px side margin.
-->
    <style>
      @font-face {
        font-family: Inter;
        src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2)
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url(../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2)
          format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f4f4f5;
        color: #050506;
        font-family: Inter, sans-serif;
        display: grid;
        grid-template-columns: 372px 1fr;
        gap: 36px;
        padding: 54px 100px;
      }
      .l {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .id {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .id img {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        object-fit: cover;
      }
      .name {
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .role {
        margin-top: 4px;
        color: #5f6167;
        font-family: 'Geist Mono', monospace;
        font-size: 14px;
        letter-spacing: 0.04em;
      }
      h1 {
        margin: 34px 0 0 -3px;
        font-size: 66px;
        font-weight: 580;
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      h1 em {
        font-style: normal;
        color: #2a4bff;
      }
      .line {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 30px;
        color: #26272b;
        font-family: 'Geist Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .line::before {
        content: '';
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2a4bff;
      }
      .g {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 12px;
        min-height: 0;
      }
      .t {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background: #e2e2e5;
        box-shadow:
          0 1px 2px rgba(5, 5, 6, 0.06),
          0 10px 26px rgba(5, 5, 6, 0.1);
      }
      .t img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .t b {
        position: absolute;
        left: 10px;
        bottom: 10px;
        padding: 5px 9px;
        border-radius: 4px;
        background: rgba(5, 5, 6, 0.78);
        color: #fff;
        font-family: 'Geist Mono', monospace;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="l">
      <div class="id">
        <img src="../../public/assets/media/profile-chuanhan.jpg" />
        <div>
          <div class="name">Chuan-Han Li</div>
          <div class="role">M.Sc. Robotics · NUS</div>
        </div>
      </div>
      <h1>Robotics &amp; <em>Embodied AI</em></h1>
      <div class="line">Research · projects · CV</div>
    </div>
    <div class="g">
      <div class="t"><img src="tiles/arm.webp" /><b>Research · illustration</b></div>
      <div class="t"><img src="tiles/humanoid.webp" /><b>Humanoid manipulation</b></div>
      <div class="t">
        <img src="tiles/catchpoint.webp" style="object-position: 50% 35%" /><b>Balance assistance</b>
      </div>
      <div class="t"><img src="../../public/assets/media/cleaning-final.webp" /><b>Mobile robot</b></div>
    </div>
  </body>
</html>
