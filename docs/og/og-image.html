<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Inter;
        src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2)
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url(../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2)
          format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        display: grid;
        grid-template-columns: 500px 1fr;
        gap: 40px;
        width: 1200px;
        height: 630px;
        padding: 56px 52px 52px 64px;
        overflow: hidden;
        background: #0a0a0b;
        color: #f5f5f6;
        font-family: Inter, sans-serif;
      }
      .l {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .mono {
        color: #8f9197;
        font-family: 'Geist Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 0 -4px;
        font-size: 84px;
        font-weight: 560;
        line-height: 0.92;
        letter-spacing: -0.06em;
        white-space: nowrap;
      }
      .tag {
        margin-top: 22px;
        color: #c8c9cd;
        font-size: 22px;
        line-height: 1.4;
      }
      .url {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        padding-top: 16px;
        border-top: 1px solid #3b3c41;
      }
      .url::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3d5cff;
      }
      .g {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 12px;
        min-height: 0;
      }
      .t {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        background: #141416;
      }
      .t img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .t b {
        position: absolute;
        bottom: 10px;
        left: 10px;
        padding: 5px 8px;
        border-radius: 4px;
        background: rgba(10, 10, 11, 0.78);
        color: #f5f5f6;
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="l">
      <div class="mono">Robotics · Embodied AI</div>
      <h1>Chuan-Han Li</h1>
      <div class="tag">I build robotic systems across perception, planning, and reliable autonomy.</div>
      <div class="url mono">chuanhan1013.github.io</div>
    </div>
    <div class="g">
      <div class="t">
        <img src="tiles/fr3.webp" style="object-position: 50% 40%" /><b>Whole-arm avoidance · illustration</b>
      </div>
      <div class="t">
        <img src="tiles/vla14.webp" style="object-position: 50% 50%" /><b>Humanoid manipulation</b>
      </div>
      <div class="t">
        <img src="tiles/cp2.webp" style="object-position: 50% 35%" /><b>Balance assistance</b>
      </div>
      <div class="t">
        <img src="../../public/assets/media/cleaning-final.webp" style="object-position: 50% 50%" /><b
          >Mobile robot</b
        >
      </div>
    </div>
  </body>
</html>
