<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Social preview card (1200×630). Designed for small sizes: LinkedIn shows it as a thumbnail
      a few hundred pixels wide and may trim the sides, so it carries one line of large type and
      one image, kept inside a wide margin.
    -->
    <style>
      @font-face {
        font-family: Inter;
        src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2)
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url(../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2)
          format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0a0b;
        color: #f5f5f6;
        font-family: Inter, sans-serif;
      }
      .arm {
        position: absolute;
        top: -38px;
        right: -128px;
        width: 860px;
        mask-image: radial-gradient(ellipse 50% 58% at 47% 48%, #000 52%, transparent 100%);
      }
      .text {
        position: absolute;
        bottom: 84px;
        left: 88px;
      }
      .mono {
        color: #9a9ca3;
        font-family: 'Geist Mono', monospace;
        font-size: 24px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 20px 0 0 -6px;
        font-size: 112px;
        font-weight: 560;
        line-height: 0.92;
        letter-spacing: -0.06em;
        white-space: nowrap;
      }
      .url {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 36px;
        color: #c8c9cd;
      }
      .url::before {
        content: '';
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #3d5cff;
      }
      .note {
        position: absolute;
        right: 88px;
        bottom: 60px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <img class="arm" src="tiles/arm.webp" alt="" />
    <div class="text">
      <div class="mono">Robotics · Embodied AI</div>
      <h1>Chuan-Han Li</h1>
      <div class="url mono">chuanhan1013.github.io</div>
    </div>
    <div class="note mono">Illustration</div>
  </body>
</html>
